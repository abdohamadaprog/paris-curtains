name: paris_curtian_app
description: "Paris Curtains Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  # Images and networking
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1

  # أنيميشن تكبير الكارت داخل نفس الصفحة (مثبّتة على إصدار محدد لأن المكتبة جديدة وبتتغير بسرعة)
  hero_here: 2.3.5
  http: ^1.6.0
  easy_localization: ^3.0.7

  # Utilities
  intl: 0.20.3
  shared_preferences: ^2.5.3
  gal: ^2.1.3
  path_provider: ^2.1.2

  # Admin dashboard
  local_auth: ^2.1.8
  table_calendar: ^3.0.9
  fl_chart: ^0.66.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # Only the assets that the code actually uses.
  # (the other files in assets/images and assets/icons are not referenced
  # anywhere in lib/, so they are no longer bundled in the app)
  assets:
    - assets/images/paris1.png
    - assets/images/abdo.jpg
    - assets/images/logo.png      # ✅ أضف هذا السطر لتشغيل اللوجو
    - assets/images/whatsapp.png  # ✅ أضف هذا السطر لتشغيل أيقونة الواتساب
    - assets/translations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

    - family: Aref Ruqaa
      fonts:
        - asset: assets/fonts/ArefRuqaa-Bold.ttf
          weight: 700
        - asset: assets/fonts/ArefRuqaa-Regular.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  min_sdk_android: 21
  remove_alpha_ios: true
  image_path: "assets/images/icon_foreground.png"
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
